name: Experiment Checks

"on":
  push:
  pull_request:

jobs:
  experiments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-run analysis
        run: python experiments/experiment9_multi_run_analysis.py

      - name: Run failure matrix
        run: python experiments/experiment10_failure_matrix.py

      - name: Run reliability score framework
        run: python experiments/experiment14_reliability_score.py

      - name: Run confidence calibration analysis
        run: python experiments/experiment13_calibration.py

      - name: Run distribution shift analysis
        run: python experiments/experiment15_distribution_shift.py

      - name: Build cross-experiment reliability index
        run: python experiments/experiment16_reliability_index.py
